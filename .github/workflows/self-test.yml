name: Self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  positive:
    name: Fixture is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run dep5-vendor-gen action
        id: check
        uses: ./
        with:
          working-directory: tests/fixtures
          vendor-dirs: vendor

      - name: Assert up-to-date
        run: |
          if [[ "${{ steps.check.outputs.up-to-date }}" != "true" ]]; then
            echo "::error::Expected fixture to be up to date, got up-to-date=${{ steps.check.outputs.up-to-date }}"
            exit 1
          fi

  negative:
    name: Stale copyright is detected
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mutate fixture copyright file
        run: |
          sed -i 's/2020 John Example/2099 Mutated Person/' tests/fixtures/debian/copyright

      - name: Run dep5-vendor-gen action (fail-on-diff disabled for assertion)
        id: check
        uses: ./
        with:
          working-directory: tests/fixtures
          vendor-dirs: vendor
          fail-on-diff: 'false'

      - name: Assert stale detection
        run: |
          if [[ "${{ steps.check.outputs.up-to-date }}" != "false" ]]; then
            echo "::error::Expected mutated fixture to be reported as stale, got up-to-date=${{ steps.check.outputs.up-to-date }}"
            exit 1
          fi
          if [[ -z "${{ steps.check.outputs.diff }}" ]]; then
            echo "::error::Expected a non-empty diff output"
            exit 1
          fi

  negative-fails-by-default:
    name: Stale copyright fails the job by default
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mutate fixture copyright file
        run: |
          sed -i 's/2020 John Example/2099 Mutated Person/' tests/fixtures/debian/copyright

      - name: Run dep5-vendor-gen action (expected to fail)
        id: check
        continue-on-error: true
        uses: ./
        with:
          working-directory: tests/fixtures
          vendor-dirs: vendor

      - name: Assert step failed
        run: |
          if [[ "${{ steps.check.outcome }}" != "failure" ]]; then
            echo "::error::Expected the check step to fail on a stale copyright file by default"
            exit 1
          fi
